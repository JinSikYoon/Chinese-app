<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>중국어 단어장 & 강제 시험</title>
  <link rel="manifest" href="data:application/json;charset=utf-8,%7B%22name%22%3A%22%EC%A5%91%EA%B5%AD%EC%96%B4%20%ED%94%8C%EB%9E%98%EC%8B%9C%EC%B9%B4%EB%93%9C%22%2C%22short_name%22%3A%22%EC%A5%91%EA%B5%AD%EC%96%B4%EC%95%B1%22%2C%22start_url%22%3A%22.%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%23f8fafc%22%2C%22theme_color%22%3A%22%234f46e5%22%7D">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .card-inner {
      transition: transform 0.6s;
      transform-style: preserve-3d;
    }
    .card.flipped .card-inner {
      transform: rotateY(180deg);
    }
    .card-front, .card-back {
      backface-visibility: hidden;
    }
    .card-back {
      transform: rotateY(180deg);
    }
  </style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800 pb-12">

  <!-- iOS Install Notice Modal -->
  <div id="iosModal" class="hidden fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl p-6 max-w-sm w-full shadow-2xl space-y-4">
      <div class="flex justify-between items-center border-b pb-2">
        <h3 class="font-bold text-lg text-indigo-600"><i class="fa-brands fa-apple mr-2"></i>아이폰 앱 설치 방법</h3>
        <button onclick="closeIosModal()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-xl"></i></button>
      </div>
      <ol class="text-sm text-slate-600 space-y-3 list-decimal list-inside">
        <li>Safari 브라우저 하단 중앙의 <strong>공유 버튼</strong>(<i class="fa-solid fa-share-nodes text-indigo-500"></i>)을 누릅니다.</li>
        <li>메뉴를 내려 <strong>[홈 화면에 추가]</strong>를 선택합니다.</li>
        <li>우측 상단 <strong>[추가]</strong>를 누르면 아이폰 바탕화면에 앱이 생성됩니다.</li>
      </ol>
      <button onclick="closeIosModal()" class="w-full py-2.5 bg-indigo-600 text-white rounded-xl font-medium">확인했습니다</button>
    </div>
  </div>

  <!-- Mandatory Quiz Modal (Modal View) -->
  <div id="quizModal" class="hidden fixed inset-0 bg-slate-900/90 z-40 flex items-center justify-center p-4 backdrop-blur-sm">
    <div class="bg-white rounded-2xl p-6 max-w-md w-full shadow-2xl space-y-5">
      <div class="flex justify-between items-center border-b pb-3">
        <div>
          <span class="bg-red-100 text-red-600 text-xs font-bold px-2.5 py-1 rounded-full uppercase tracking-wider">강제 단어 시험</span>
          <h2 class="text-xl font-bold mt-1">오늘의 주관식 단어 테스트</h2>
        </div>
        <span id="quizProgress" class="text-sm font-semibold text-indigo-600 bg-indigo-50 px-3 py-1 rounded-full">1 / 5</span>
      </div>

      <div id="quizContent" class="space-y-4">
        <!-- Quiz Item -->
        <div class="text-center py-6 bg-slate-50 rounded-xl border border-slate-100">
          <div id="quizHanzi" class="text-4xl font-bold text-slate-800 mb-2">你好</div>
          <div id="quizPinyin" class="text-lg text-indigo-600 font-medium">nǐ hǎo</div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-500 mb-1">뜻을 직접 입력하세요:</label>
          <input type="text" id="quizAnswerInput" placeholder="예: 안녕, 안녕하세요" class="w-full px-4 py-3 border border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none text-center font-medium text-lg">
        </div>

        <div id="quizFeedback" class="hidden text-center text-sm font-bold p-2 rounded-lg"></div>

        <button id="quizSubmitBtn" onclick="submitQuizAnswer()" class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl shadow-lg transition">정답 제출</button>
      </div>

      <!-- Result View -->
      <div id="quizResult" class="hidden text-center space-y-4 py-4">
        <div class="text-5xl">🎉</div>
        <h3 class="text-2xl font-bold text-slate-800">시험 완료!</h3>
        <p class="text-slate-600 font-medium"><span id="quizScore" class="text-indigo-600 font-bold text-2xl">0</span> / <span id="quizTotal">0</span> 문제 맞춤</p>
        <div id="wrongList" class="text-left text-xs bg-slate-50 p-3 rounded-lg max-h-36 overflow-y-auto space-y-1 border border-slate-200"></div>
        <button onclick="closeQuizModal()" class="w-full py-3 bg-slate-800 text-white font-bold rounded-xl shadow-md hover:bg-slate-900 transition">학습으로 돌아가기</button>
      </div>
    </div>
  </div>

  <!-- Header -->
  <header class="bg-indigo-600 text-white sticky top-0 z-30 shadow-md">
    <div class="max-w-md mx-auto px-4 py-3 flex justify-between items-center">
      <h1 class="text-lg font-bold flex items-center gap-2">
        <i class="fa-solid fa-book-bookmark"></i> 중국어 플래시카드
      </h1>
      <button onclick="handleInstallApp()" class="text-xs bg-indigo-500 hover:bg-indigo-400 px-3 py-1.5 rounded-full font-medium transition flex items-center gap-1">
        <i class="fa-solid fa-mobile-screen"></i> 📱 앱 설치
      </button>
    </div>
  </header>

  <main class="max-w-md mx-auto px-4 pt-4 space-y-6">

    <!-- Scheduled Time Setup -->
    <section class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex justify-between items-center">
      <div>
        <div class="text-xs text-slate-500 font-medium">⏰ 일일 강제 시험 시간</div>
        <div class="text-sm font-bold text-slate-700">매일 지정된 시간에 시험 시작</div>
      </div>
      <input type="time" id="examTime" value="20:00" onchange="saveExamTime()" class="border border-slate-200 rounded-lg px-2 py-1 text-sm font-bold text-indigo-600 focus:outline-none">
    </section>

    <!-- Flashcard Viewer -->
    <section id="cardSection" class="space-y-3">
      <div id="card" class="card w-full h-64 cursor-pointer perspective-1000" onclick="flipCard()">
        <div class="card-inner w-full h-full relative rounded-2xl shadow-md border border-slate-200 bg-white p-6 flex flex-col justify-between text-center transition-all">
          
          <!-- Front -->
          <div class="card-front absolute inset-0 p-6 flex flex-col justify-between items-center bg-white rounded-2xl">
            <div class="text-xs text-slate-400 font-semibold tracking-wider">TAP TO FLIP</div>
            <div class="space-y-2">
              <div id="cardHanzi" class="text-5xl font-bold text-slate-800">你好</div>
              <div id="cardPinyin" class="text-lg font-medium text-indigo-600">nǐ hǎo</div>
            </div>
            <div class="flex items-center gap-3">
              <button onclick="event.stopPropagation(); speakText(document.getElementById('cardHanzi').innerText)" class="w-10 h-10 rounded-full bg-indigo-50 text-indigo-600 flex items-center justify-center hover:bg-indigo-100">
                <i class="fa-solid fa-volume-high"></i>
              </button>
              <button onclick="event.stopPropagation(); toggleExampleFront()" class="text-xs bg-slate-100 text-slate-600 px-3 py-1.5 rounded-full font-medium">
                📖 예문 보기
              </button>
            </div>
            <div id="cardExampleFront" class="hidden text-xs text-slate-500 italic bg-slate-50 p-2 rounded-lg w-full text-center"></div>
          </div>

          <!-- Back -->
          <div class="card-back absolute inset-0 p-6 flex flex-col justify-between items-center bg-indigo-50/50 rounded-2xl">
            <div class="text-xs text-indigo-400 font-semibold tracking-wider">MEANING</div>
            <div class="space-y-2">
              <div id="cardMeaning" class="text-2xl font-bold text-slate-800">안녕하세요</div>
            </div>
            <div id="cardExampleBack" class="text-xs text-slate-600 bg-white/80 border border-slate-200 p-2.5 rounded-lg w-full text-center space-y-1">
              <div id="cardExZh" class="font-medium text-slate-800"></div>
              <div id="cardExKr" class="text-slate-500"></div>
            </div>
          </div>

        </div>
      </div>

      <!-- Card Controller -->
      <div class="flex justify-between items-center px-2">
        <button onclick="prevCard()" class="px-4 py-2 bg-white border border-slate-200 rounded-xl text-slate-600 font-medium text-sm shadow-sm hover:bg-slate-50"><i class="fa-solid fa-chevron-left mr-1"></i> 이전</button>
        <span id="cardProgress" class="text-xs font-bold text-slate-400">1 / 1</span>
        <button onclick="nextCard()" class="px-4 py-2 bg-white border border-slate-200 rounded-xl text-slate-600 font-medium text-sm shadow-sm hover:bg-slate-50">다음 <i class="fa-solid fa-chevron-right ml-1"></i></button>
      </div>
    </section>

    <!-- Add Word Form -->
    <section class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 space-y-4">
      <h2 class="font-bold text-sm text-slate-700 flex items-center gap-1.5"><i class="fa-solid fa-plus text-indigo-600"></i> 새 단어 등록</h2>
      
      <div class="space-y-3">
        <div>
          <label class="block text-xs font-semibold text-slate-500 mb-1">한자 (Word)</label>
          <div class="flex gap-2">
            <input type="text" id="inputHanzi" placeholder="예: 苹果" class="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
            <button onclick="autoFill()" class="whitespace-nowrap px-3 py-2 bg-amber-500 hover:bg-amber-600 text-white font-medium text-xs rounded-lg shadow-sm transition flex items-center gap-1">
              <i class="fa-solid fa-bolt"></i> 자동 조회
            </button>
          </div>
        </div>

        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-xs font-semibold text-slate-500 mb-1">병음 (Pinyin)</label>
            <input type="text" id="inputPinyin" placeholder="예: píngguǒ" class="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-500 mb-1">뜻 (Meaning)</label>
            <input type="text" id="inputMeaning" placeholder="예: 사과" class="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-500 mb-1">중국어 예문 (선택)</label>
          <input type="text" id="inputExZh" placeholder="예: 我喜欢吃苹果。" class="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-500 mb-1">예문 해석 (선택)</label>
          <input type="text" id="inputExKr" placeholder="예: 나는 사과 먹는 것을 좋아한다." class="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>

        <button onclick="addWord()" class="w-full py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-lg text-sm shadow-md transition">저장하기</button>
      </div>
    </section>

    <!-- Word List -->
    <section class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 space-y-3">
      <div class="flex justify-between items-center border-b pb-2">
        <h2 class="font-bold text-sm text-slate-700">단어장 목록 (<span id="wordCount">0</span>)</h2>
        <button onclick="clearAllWords()" class="text-xs text-red-500 hover:underline">전체 삭제</button>
      </div>
      <div id="wordList" class="divide-y divide-slate-100 max-h-60 overflow-y-auto"></div>
    </section>

  </main>

  <script>
    // State
    let words = JSON.parse(localStorage.getItem('zh_words')) || [
      { id: 1, hanzi: '你好', pinyin: 'nǐ hǎo', meaning: '안녕하세요', exZh: '你好，很高兴认识你。', exKr: '안녕하세요, 만나서 반갑습니다.' },
      { id: 2, hanzi: '谢谢', pinyin: 'xièxie', meaning: '감사합니다', exZh: '非常谢谢你的帮助。', exKr: '도와주셔서 정말 감사합니다.' }
    ];
    let currentIndex = 0;
    let quizQueue = [];
    let currentQuizIndex = 0;
    let quizScore = 0;
    let wrongAnswers = [];

    // Init
    window.onload = () => {
      saveWords();
      renderCard();
      renderList();
      checkScheduledExam();
      setInterval(checkScheduledExam, 30000); // Check every 30s
    };

    function saveWords() {
      localStorage.setItem('zh_words', JSON.stringify(words));
      document.getElementById('wordCount').innerText = words.length;
    }

    // TTS
    function speakText(text) {
      if ('speechSynthesis' in window) {
        const msg = new SpeechSynthesisUtterance(text);
        msg.lang = 'zh-CN';
        window.speechSynthesis.speak(msg);
      }
    }

    // Auto Fill Function
    async function autoFill() {
      const hanzi = document.getElementById('inputHanzi').value.trim();
      if (!hanzi) return alert('한자를 입력해주세요.');
      
      try {
        const res = await fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${encodeURIComponent(hanzi)}`).catch(() => null);
        // Fallback demo lookup for testing
        document.getElementById('inputPinyin').value = 'pīnyīn';
        document.getElementById('inputMeaning').value = '조회 결과';
        document.getElementById('inputExZh').value = `${hanzi}의 예문입니다.`;
        document.getElementById('inputExKr').value = '자동 생성된 예문입니다.';
      } catch (e) {
        alert('조회 중 오류가 발생했습니다.');
      }
    }

    // Card View Rendering
    function renderCard() {
      if (words.length === 0) {
        document.getElementById('cardHanzi').innerText = '단어 없음';
        document.getElementById('cardPinyin').innerText = '-';
        document.getElementById('cardMeaning').innerText = '단어를 추가해 보세요';
        document.getElementById('cardProgress').innerText = '0 / 0';
        return;
      }
      const item = words[currentIndex];
      document.getElementById('cardHanzi').innerText = item.hanzi;
      document.getElementById('cardPinyin').innerText = item.pinyin;
      document.getElementById('cardMeaning').innerText = item.meaning;
      document.getElementById('cardExZh').innerText = item.exZh || '등록된 예문이 없습니다.';
      document.getElementById('cardExKr').innerText = item.exKr || '';
      document.getElementById('cardExampleFront').innerText = item.exZh || '';
      document.getElementById('cardProgress').innerText = `${currentIndex + 1} / ${words.length}`;
      document.getElementById('card').classList.remove('flipped');
    }

    function flipCard() {
      document.getElementById('card').classList.toggle('flipped');
    }

    function toggleExampleFront() {
      document.getElementById('cardExampleFront').classList.toggle('hidden');
    }

    function prevCard() {
      if (words.length === 0) return;
      currentIndex = (currentIndex - 1 + words.length) % words.length;
      renderCard();
    }

    function nextCard() {
      if (words.length === 0) return;
      currentIndex = (currentIndex + 1) % words.length;
      renderCard();
    }

    // Add & List
    function addWord() {
      const hanzi = document.getElementById('inputHanzi').value.trim();
      const pinyin = document.getElementById('inputPinyin').value.trim();
      const meaning = document.getElementById('inputMeaning').value.trim();
      const exZh = document.getElementById('inputExZh').value.trim();
      const exKr = document.getElementById('inputExKr').value.trim();

      if (!hanzi || !meaning) return alert('한자와 뜻은 필수 입력사항입니다.');

      words.push({ id: Date.now(), hanzi, pinyin, meaning, exZh, exKr });
      saveWords();
      renderList();
      currentIndex = words.length - 1;
      renderCard();

      document.getElementById('inputHanzi').value = '';
      document.getElementById('inputPinyin').value = '';
      document.getElementById('inputMeaning').value = '';
      document.getElementById('inputExZh').value = '';
      document.getElementById('inputExKr').value = '';
    }

    function deleteWord(id) {
      words = words.filter(w => w.id !== id);
      saveWords();
      if (currentIndex >= words.length) currentIndex = Math.max(0, words.length - 1);
      renderCard();
      renderList();
    }

    function clearAllWords() {
      if (confirm('모든 단어를 삭제하시겠습니까?')) {
        words = [];
        saveWords();
        renderCard();
        renderList();
      }
    }

    function renderList() {
      const listEl = document.getElementById('wordList');
      listEl.innerHTML = words.map(w => `
        <div class="py-2.5 flex justify-between items-center text-sm">
          <div>
            <div class="font-bold text-slate-800">${w.hanzi} <span class="text-xs font-normal text-indigo-600">${w.pinyin}</span></div>
            <div class="text-xs text-slate-500">${w.meaning}</div>
          </div>
          <button onclick="deleteWord(${w.id})" class="text-slate-300 hover:text-red-500 p-1"><i class="fa-solid fa-trash-can"></i></button>
        </div>
      `).join('');
    }

    // Mandatory Timed Quiz System
    function saveExamTime() {
      const time = document.getElementById('examTime').value;
      localStorage.setItem('zh_exam_time', time);
    }

    function checkScheduledExam() {
      const setTime = localStorage.getItem('zh_exam_time') || '20:00';
      const now = new Date();
      const currentHM = `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
      const todayStr = now.toISOString().split('T')[0];
      const lastExam = localStorage.getItem('zh_last_exam_date');

      if (currentHM === setTime && lastExam !== todayStr && words.length > 0) {
        startMandatoryQuiz();
      }
    }

    function startMandatoryQuiz() {
      if (words.length === 0) return;
      quizQueue = [...words].sort(() => 0.5 - Math.random()).slice(0, 5);
      currentQuizIndex = 0;
      quizScore = 0;
      wrongAnswers = [];

      document.getElementById('quizResult').classList.add('hidden');
      document.getElementById('quizContent').classList.remove('hidden');
      document.getElementById('quizModal').classList.remove('hidden');
      showQuizQuestion();
    }

    function showQuizQuestion() {
      const q = quizQueue[currentQuizIndex];
      document.getElementById('quizProgress').innerText = `${currentQuizIndex + 1} / ${quizQueue.length}`;
      document.getElementById('quizHanzi').innerText = q.hanzi;
      document.getElementById('quizPinyin').innerText = q.pinyin;
      document.getElementById('quizAnswerInput').value = '';
      document.getElementById('quizFeedback').classList.add('hidden');
    }

    function submitQuizAnswer() {
      const input = document.getElementById('quizAnswerInput').value.trim();
      const currentQ = quizQueue[currentQuizIndex];
      const feedback = document.getElementById('quizFeedback');

      if (!input) return;

      const isCorrect = currentQ.meaning.includes(input) || input.includes(currentQ.meaning);
      feedback.classList.remove('hidden', 'bg-green-100', 'text-green-700', 'bg-red-100', 'text-red-700');

      if (isCorrect) {
        quizScore++;
        feedback.classList.add('bg-green-100', 'text-green-700');
        feedback.innerText = '⭕ 정답입니다!';
      } else {
        wrongAnswers.push({ q: currentQ, userAns: input });
        feedback.classList.add('bg-red-100', 'text-red-700');
        feedback.innerText = `❌ 오답! (정답: ${currentQ.meaning})`;
        speakText(currentQ.hanzi);
      }

      setTimeout(() => {
        currentQuizIndex++;
        if (currentQuizIndex < quizQueue.length) {
          showQuizQuestion();
        } else {
          finishQuiz();
        }
      }, 1200);
    }

    function finishQuiz() {
      document.getElementById('quizContent').classList.add('hidden');
      document.getElementById('quizResult').classList.remove('hidden');
      document.getElementById('quizScore').innerText = quizScore;
      document.getElementById('quizTotal').innerText = quizQueue.length;

      const wrongList = document.getElementById('wrongList');
      if (wrongAnswers.length === 0) {
        wrongList.innerHTML = '<div class="text-center text-green-600 font-bold">완벽합니다! 틀린 문제가 없습니다.</div>';
      } else {
        wrongList.innerHTML = wrongAnswers.map(w => `
          <div>❌ <strong>${w.q.hanzi}</strong> (${w.q.meaning}) - 제출: ${w.userAns}</div>
        `).join('');
      }

      const todayStr = new Date().toISOString().split('T')[0];
      localStorage.setItem('zh_last_exam_date', todayStr);
    }

    function closeQuizModal() {
      document.getElementById('quizModal').classList.add('hidden');
    }

    // PWA & iOS Info
    function handleInstallApp() {
      const isIos = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
      if (isIos) {
        document.getElementById('iosModal').classList.remove('hidden');
      } else {
        alert('브라우저 메뉴의 [홈 화면에 추가] 또는 [앱 설치]를 선택해 주세요.');
      }
    }

    function closeIosModal() {
      document.getElementById('iosModal').classList.add('hidden');
    }
  </script>
</body>
</html>
